name: FPGA qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "fpga/**"
      - ".github/workflows/fpga-qualification.yml"
  push:
    paths:
      - "fpga/**"
      - ".github/workflows/fpga-qualification.yml"

permissions:
  contents: read

jobs:
  ecp5-85k-smoke:
    runs-on: ubuntu-latest
    container:
      image: hdlc/impl:latest
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: |
          yosys -V
          nextpnr-ecp5 --version
      - name: Synthesize ECP5 smoke RTL
        run: |
          mkdir -p build
          yosys -l build/yosys.log -p 'read_verilog fpga/qualification/ecp5_85k_smoke.v; synth_ecp5 -top ecp5_85k_smoke -json build/smoke.json'
      - name: Validate 85K target is available
        run: |
          nextpnr-ecp5 --help 2>&1 | tee build/nextpnr-help.txt
          grep -Eq -- '--um5g-85k|--85k' build/nextpnr-help.txt
      - name: Synthesize native RetroCore ECP5 adapter
        run: |
          yosys -l build/retrocore-adapter-yosys.log -p 'read_verilog fpga/retrocore/platform/clock_reset.v fpga/retrocore/platform/retrocore_ecp5_top.v; synth_ecp5 -top retrocore_ecp5_top -json build/retrocore-adapter.json'

      - name: Synthesize SDRAM bridge contract
        run: |
          yosys -l build/sdram-bridge-yosys.log -p 'read_verilog fpga/retrocore/platform/sdram_bridge.v fpga/retrocore/platform/sdram_model.v fpga/retrocore/platform/sdram_qual_top.v; synth_ecp5 -top sdram_qual_top -json build/sdram-bridge.json'

      - name: Synthesize SDR SDRAM controller
        run: |
          yosys -l build/sdram-controller-yosys.log -p 'read_verilog fpga/retrocore/platform/sdram_controller.v fpga/retrocore/platform/sdram_controller_qual_top.v; synth_ecp5 -top sdram_controller_qual_top -json build/sdram-controller.json'

      - name: Fetch pinned Minimig-AGA upstream
        run: |
          chmod +x fpga/qualification/fetch-minimig-aga.sh
          fpga/qualification/fetch-minimig-aga.sh
          test "$(cat build/upstream/minimig-aga/RETROSBC_PINNED_REVISION)" = "$(sed -n 's/^UPSTREAM_COMMIT=//p' fpga/qualification/minimig-aga.lock)"

      - name: Audit upstream portability blockers
        run: |
          mkdir -p build
          {
            echo "# M3.2 upstream audit"
            echo
            echo "Pinned revision: $(cat build/upstream/minimig-aga/RETROSBC_PINNED_REVISION)"
            echo
            echo "## Intel/Altera-specific references"
            grep -RIlE 'altera|cyclone|ALTPLL|altera_pll|arria|quartus|HPS' build/upstream/minimig-aga --include='*.v' --include='*.sv' --include='*.vhd' --include='*.qsf' --include='*.sdc' 2>/dev/null | sed 's#build/upstream/minimig-aga/##' | sort -u || true
            echo
            echo "## Candidate HDL inventory"
            find build/upstream/minimig-aga -type f \( -name '*.v' -o -name '*.sv' -o -name '*.vhd' \) | sed 's#build/upstream/minimig-aga/##' | sort
          } > build/m3_2-upstream-audit.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecp5-85k-smoke-logs
          path: build/
