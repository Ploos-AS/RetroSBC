name: KiCad management schematic gate

on:
  push:
    paths:
      - 'hardware/kicad/13_MANAGEMENT/**'
      - 'tools/check_management_slice_a_preflight.py'
      - '.github/workflows/kicad-management.yml'
  pull_request:
    paths:
      - 'hardware/kicad/13_MANAGEMENT/**'
      - 'tools/check_management_slice_a_preflight.py'
      - '.github/workflows/kicad-management.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull KiCad CLI image
        run: docker pull kicad/kicad:9.0.6
      - name: KiCad version
        run: docker run --rm kicad/kicad:9.0.6 kicad-cli version
      - name: Native Slice A source contract
        run: |
          python3 tools/check_rp2354b_power_capture.py
          test -s hardware/kicad/13_MANAGEMENT/RetroSBC-management.kicad_sym
      - name: Parse management schematic by exporting PDF
        run: |
          mkdir -p /tmp/retrosbc-kicad
          chmod 0777 /tmp/retrosbc-kicad
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -v /tmp/retrosbc-kicad:/out \
            kicad/kicad:9.0.6 \
            kicad-cli sch export pdf \
              --output /out/13_MANAGEMENT.pdf \
              hardware/kicad/13_MANAGEMENT/13_MANAGEMENT.kicad_sch
          test -s /tmp/retrosbc-kicad/13_MANAGEMENT.pdf
      - name: Export native management netlist
        run: |
          mkdir -p /tmp/retrosbc-kicad
          chmod 0777 /tmp/retrosbc-kicad
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -v /tmp/retrosbc-kicad:/out \
            kicad/kicad:9.0.6 \
            kicad-cli sch export netlist \
              --output /out/13_MANAGEMENT.net \
              hardware/kicad/13_MANAGEMENT/13_MANAGEMENT.kicad_sch
          test -s /tmp/retrosbc-kicad/13_MANAGEMENT.net
      - name: Verify native Slice A netlist
        run: python3 tools/check_management_native_netlist.py /tmp/retrosbc-kicad/13_MANAGEMENT.net
      - name: Verify native USB passive capture
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("/tmp/retrosbc-kicad/13_MANAGEMENT.net").getroot()
          components = {
              comp.findtext("ref"): comp.findtext("value")
              for comp in root.findall("./components/comp")
          }
          expected = {
              "R_USB_DP": "27R",
              "R_USB_DM": "27R",
              "R_CC1": "5.1k 1%",
              "R_CC2": "5.1k 1%",
          }
          for ref, value in expected.items():
              actual = components.get(ref)
              if actual != value:
                  raise SystemExit(f"{ref}: expected {value!r}, got {actual!r}")
          print("Native USB passive values: PASS")
          PY

      - name: Run KiCad ERC
        run: |
          mkdir -p /tmp/retrosbc-kicad
          chmod 0777 /tmp/retrosbc-kicad
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -v /tmp/retrosbc-kicad:/out \
            kicad/kicad:9.0.6 \
            kicad-cli sch erc \
              --output /out/13_MANAGEMENT-erc.rpt \
              hardware/kicad/13_MANAGEMENT/13_MANAGEMENT.kicad_sch
          test -f /tmp/retrosbc-kicad/13_MANAGEMENT-erc.rpt
          cat /tmp/retrosbc-kicad/13_MANAGEMENT-erc.rpt
          if grep -Eq 'Errors [1-9][0-9]*' /tmp/retrosbc-kicad/13_MANAGEMENT-erc.rpt; then
            echo "ERC contains errors"
            exit 1
          fi
      - name: Upload KiCad qualification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: management-kicad-qualification
          path: |
            /tmp/retrosbc-kicad/13_MANAGEMENT.pdf
            /tmp/retrosbc-kicad/13_MANAGEMENT.net
            /tmp/retrosbc-kicad/13_MANAGEMENT-erc.rpt
          if-no-files-found: error
          retention-days: 14
