name: KiCad management schematic gate

on:
  push:
    paths:
      - 'hardware/kicad/13_MANAGEMENT/**'
      - 'tools/**'
      - '.github/workflows/kicad-management.yml'
  pull_request:
    paths:
      - 'hardware/kicad/13_MANAGEMENT/**'
      - 'tools/**'
      - '.github/workflows/kicad-management.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull KiCad CLI image
        run: docker pull kicad/kicad:9.0.6
      - name: KiCad version
        run: docker run --rm kicad/kicad:9.0.6 kicad-cli version
      - name: TC2030 footprint source lock
        run: python3 tools/check_tc2030_footprint_source.py

      - name: Generate and verify TC2030 footprint
        run: |
          python3 tools/generate_tc2030_footprint.py
          python3 tools/check_tc2030_generated_footprint.py
          git diff --exit-code -- hardware/kicad/13_MANAGEMENT/TC2030-IDC-FP.kicad_mod
          test -z "$(git status --porcelain --untracked-files=all -- hardware/kicad/13_MANAGEMENT/TC2030-IDC-FP.kicad_mod)"

      - name: Generate and verify J_SWD capture
        run: |
          python3 tools/generate_management_jswd_capture.py
          python3 tools/check_management_jswd_capture.py
          git diff --exit-code -- hardware/kicad/13_MANAGEMENT/generated-jswd-capture.kicad_sexpr
          test -z "$(git status --porcelain --untracked-files=all -- hardware/kicad/13_MANAGEMENT/generated-jswd-capture.kicad_sexpr)"

      - name: Parse disposable J_SWD schematic
        run: |
          mkdir -p /tmp/retrosbc-kicad
          chmod 0777 /tmp/retrosbc-kicad
          python3 tools/materialize_management_jswd_test.py
          docker run --rm \
            -v "$PWD:/work" \
            -v "/tmp/retrosbc-kicad:/out" \
            -w /work \
            kicad/kicad:9.0.6 \
            kicad-cli sch export pdf -o /out/J_SWD_PARSE_TEST.pdf /out/J_SWD_PARSE_TEST.kicad_sch
          docker run --rm \
            -v "$PWD:/work" \
            -v "/tmp/retrosbc-kicad:/out" \
            -w /work \
            kicad/kicad:9.0.6 \
            kicad-cli sch erc --output /out/J_SWD_PARSE_TEST-erc.rpt /out/J_SWD_PARSE_TEST.kicad_sch || true
          cat /tmp/retrosbc-kicad/J_SWD_PARSE_TEST-erc.rpt || true
          docker run --rm \
            -v "$PWD:/work" \
            -v "/tmp/retrosbc-kicad:/out" \
            -w /work \
            kicad/kicad:9.0.6 \
            kicad-cli sch export netlist -o /out/J_SWD_PARSE_TEST.net /out/J_SWD_PARSE_TEST.kicad_sch
          grep -q '<ref>J_SWD</ref>' /tmp/retrosbc-kicad/J_SWD_PARSE_TEST.net

      - name: Upload disposable J_SWD diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jswd-disposable-diagnostics
          path: |
            /tmp/retrosbc-kicad/J_SWD_PARSE_TEST.kicad_sch
            /tmp/retrosbc-kicad/J_SWD_PARSE_TEST.pdf
            /tmp/retrosbc-kicad/J_SWD_PARSE_TEST.net
            /tmp/retrosbc-kicad/J_SWD_PARSE_TEST-erc.rpt
          if-no-files-found: warn
          retention-days: 14

      - name: Native Slice A source contract
        run: |
          python3 tools/check_rp2354b_power_capture.py
          test -s hardware/kicad/13_MANAGEMENT/RetroSBC-management.kicad_sym
      - name: Parse management schematic by exporting PDF
        run: |
          mkdir -p /tmp/retrosbc-kicad
          chmod 0777 /tmp/retrosbc-kicad
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -v /tmp/retrosbc-kicad:/out \
            kicad/kicad:9.0.6 \
            kicad-cli sch export pdf \
              --output /out/13_MANAGEMENT.pdf \
              hardware/kicad/13_MANAGEMENT/13_MANAGEMENT.kicad_sch
          test -s /tmp/retrosbc-kicad/13_MANAGEMENT.pdf
      - name: Export native management netlist
        run: |
          mkdir -p /tmp/retrosbc-kicad
          chmod 0777 /tmp/retrosbc-kicad
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -v /tmp/retrosbc-kicad:/out \
            kicad/kicad:9.0.6 \
            kicad-cli sch export netlist \
              --output /out/13_MANAGEMENT.net \
              hardware/kicad/13_MANAGEMENT/13_MANAGEMENT.kicad_sch
          test -s /tmp/retrosbc-kicad/13_MANAGEMENT.net
      - name: Verify native Slice A netlist
        run: python3 tools/check_management_native_netlist.py /tmp/retrosbc-kicad/13_MANAGEMENT.net
      - name: Verify native USB passive capture
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("/tmp/retrosbc-kicad/13_MANAGEMENT.net").read_text()
          expected = {
              "R_USB_DP": "27R",
              "R_USB_DM": "27R",
              "R_CC1": "5.1k 1%",
              "R_CC2": "5.1k 1%",
          }
          for ref, value in expected.items():
              pattern = rf'\(comp \(ref "{re.escape(ref)}"\).*?\(value "{re.escape(value)}"\)'
              if not re.search(pattern, text, re.S):
                  raise SystemExit(f"{ref}: missing or wrong value; expected {value!r}")
          print("Native USB passive capture: PASS")
          PY

      - name: Run KiCad ERC
        run: |
          mkdir -p /tmp/retrosbc-kicad
          chmod 0777 /tmp/retrosbc-kicad
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -v /tmp/retrosbc-kicad:/out \
            kicad/kicad:9.0.6 \
            kicad-cli sch erc \
              --output /out/13_MANAGEMENT-erc.rpt \
              hardware/kicad/13_MANAGEMENT/13_MANAGEMENT.kicad_sch
          test -f /tmp/retrosbc-kicad/13_MANAGEMENT-erc.rpt
          cat /tmp/retrosbc-kicad/13_MANAGEMENT-erc.rpt
          if grep -Eq 'Errors [1-9][0-9]*' /tmp/retrosbc-kicad/13_MANAGEMENT-erc.rpt; then
            echo "ERC contains errors"
            exit 1
          fi
      - name: Upload KiCad qualification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: management-kicad-qualification
          path: |
            /tmp/retrosbc-kicad/13_MANAGEMENT.pdf
            /tmp/retrosbc-kicad/13_MANAGEMENT.net
            /tmp/retrosbc-kicad/13_MANAGEMENT-erc.rpt
          if-no-files-found: error
          retention-days: 14
